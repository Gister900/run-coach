<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- speed lines -->
  <g stroke="#a3e635" stroke-linecap="round" opacity="0.55">
    <line x1="92" y1="250" x2="188" y2="250" stroke-width="14"/>
    <line x1="78" y1="300" x2="158" y2="300" stroke-width="14" opacity="0.7"/>
    <line x1="104" y1="350" x2="170" y2="350" stroke-width="14" opacity="0.45"/>
  </g>

  <!-- runner -->
  <g filter="url(#glow)" fill="none" stroke="#a3e635" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="332" cy="132" r="40" fill="#a3e635" stroke="none"/>
    <path d="M312 188 L262 296"/>
    <path d="M300 214 L240 240"/>
    <path d="M306 220 L378 244"/>
    <path d="M262 296 L312 344 L364 332"/>
    <path d="M262 296 L214 384"/>
  </g>
</svg>
